<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="api-base" content="https://api.blitzleihen.com">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login – Finanzberatung Koitzsch u. Schuchardt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/editorial.css">
  <link rel="stylesheet" href="../css/admin-editorial.css">
  <link rel="icon" type="image/webp" href="../../logo-ks.webp">
</head>
<body class="admin-body">

  <main class="admin-login-page" role="main">
    <div class="admin-login-card">


      <div class="admin-login-logo">
        <img src="../../logo-ks.webp" alt="Finanzberatung Koitzsch u. Schuchardt">
      </div>

      <span class="admin-login-badge">🔒 Geschützter Bereich</span>
      <h1 class="admin-login-title">Administratorbereich</h1>
      <p class="admin-login-subtitle">Bitte melden Sie sich mit Ihren Zugangsdaten an</p>


      <div id="loginError" class="alert alert-error" style="display:none; margin-bottom:var(--space-5);">
        <span>⚠</span>
        <span>Ungültige Zugangsdaten. Bitte versuchen Sie es erneut.</span>
      </div>


      <form class="admin-login-form" id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Benutzername</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="admin@blitzleihen.com"
            required
            autocomplete="username"
            autofocus
          >
          <span class="form-error" style="display:none;"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Passwort
            <a href="#" id="forgotPasswordLink" style="font-size:var(--text-xs); color:var(--color-primary-light); float:right; margin-left:auto; font-weight:var(--weight-regular);">Passwort vergessen?</a>
          </label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••••"
              required
              autocomplete="current-password"
              style="padding-right:3rem;"
            >

            <button
              type="button"
              id="togglePassword"
              style="position:absolute; right:var(--space-3); top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--color-text-muted); font-size:1rem;"
              aria-label="Passwort anzeigen/verbergen"
            >
              👁
            </button>
          </div>
          <span class="form-error" style="display:none;"></span>
        </div>


        <label style="display:flex; align-items:center; gap:var(--space-2); cursor:pointer; font-size:var(--text-sm); color:var(--color-text-light);">
          <input type="checkbox" name="remember" style="accent-color:var(--color-primary);">
          Angemeldet bleiben
        </label>


        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%; justify-content:center; margin-top:var(--space-2);">
          Anmelden
        </button>

      </form>


      <div style="text-align:center; margin-top:var(--space-6); padding-top:var(--space-6); border-top:1px solid var(--color-border);">
        <a href="../index.html" style="font-size:var(--text-sm); color:var(--color-text-muted);">
          ← Zurück zur Website
        </a>
      </div>


      <p style="text-align:center; font-size:0.7rem; color:var(--color-text-muted); margin-top:var(--space-4);">
        🔒 Diese Verbindung ist SSL-verschlüsselt und sicher.
      </p>

    </div>
  </main>

  <script src="../js/admin-common.js"></script>
  <script>(function() {
  "use strict";
  var AUTH_URL = window.BlitzAdmin.API_BASE + "/auth/login";
  var form = document.getElementById("loginForm");
  var loginBtn = document.getElementById("loginBtn");
  var errorEl = document.getElementById("loginError");
  var toggleBtn = document.getElementById("togglePassword");
  var passInput = document.getElementById("password");
  var forgotLink = document.getElementById("forgotPasswordLink");
  if (forgotLink) {
    forgotLink.addEventListener("click", function(e) {
      e.preventDefault();
      window.BlitzAdmin.showToast("Bitte wenden Sie sich direkt an Ihren technischen Ansprechpartner.");
    });
  }
  if (toggleBtn && passInput) {
    toggleBtn.addEventListener("click", function() {
      var isPassword = passInput.type === "password";
      passInput.type = isPassword ? "text" : "password";
      toggleBtn.textContent = isPassword ? "\u{1F512}" : "\u{1F441}";
    });
  }
  if (form) {
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      if (!username || !password) {
        showError("Bitte f\xFCllen Sie alle Felder aus.");
        return;
      }
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = "Anmeldung\u2026";
      }
      fetch(AUTH_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      }).then(function(response) {
        return response.json().then(function(data) {
          return { ok: response.ok, status: response.status, data };
        });
      }).then(function(result) {
        if (result.ok && result.data.token) {
          sessionStorage.setItem("blitz_admin_token", result.data.token);
          sessionStorage.setItem("blitz_admin_user", JSON.stringify(result.data.user || {}));
          sessionStorage.setItem("blitz_admin_expires", result.data.expiresAt || "");
          window.location.href = "dashboard.html";
        } else {
          var msg = result.data.message || "E-Mail oder Passwort ist falsch";
          showError(msg);
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Anmelden";
          }
        }
      }).catch(function() {
        showError("Verbindung zum Server fehlgeschlagen. Bitte versuchen Sie es sp\xE4ter erneut.");
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = "Anmelden";
        }
      });
    });
  }
  function showError(msg) {
    if (errorEl) {
      var msgEl = errorEl.querySelector("p, span, [data-msg]");
      if (msgEl && msg) msgEl.textContent = msg;
      errorEl.style.display = "flex";
    }
    setTimeout(function() {
      if (errorEl) errorEl.style.display = "none";
    }, 6e3);
  }
})();
</script>
</body>
</html>
